<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Play chess against bots, get paired with someone online, or duel a friend by link." />
    <title>Quiet Move: play chess online</title>
    <script>
      // Set the saved theme before first paint so the page does not flash.
      try { document.documentElement.dataset.theme = localStorage.getItem('qm:theme') || 'light' } catch (e) {}
      // Motion is full unless the device asks for less. The footer switch overrides either way.
      var m = null; try { m = localStorage.getItem('qm:motion') } catch (e) {}
      document.documentElement.dataset.motion = m || (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'calm' : 'full')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
